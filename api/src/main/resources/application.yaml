spring:
  application:
    name: api
  docker:
    compose:
      file: ../infra/compose.yaml

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:qwen3:8b}
      temperature: 0.2
      timeout: 120s
      log-requests: false
      log-responses: false
    embedding-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: 60s
