services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telai
      POSTGRES_USER: telai
      POSTGRES_PASSWORD: telai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telai -d telai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
